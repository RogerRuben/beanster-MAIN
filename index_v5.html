{width:min(520px,100%);max-height:82vh;overflow:auto;background:#fffaf4;border-radius:24px;padding:18px;box-shadow:0 24px 70px rgba(50,30,18,.24)}.report-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.report-head button{border:0;background:transparent;font-size:25px;color:var(--muted)}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.report-grid div{background:#f4e8dc;border-radius:13px;padding:11px}.report-grid span{font-size:10px;color:var(--muted);display:block}.report-grid b{font-size:18px}.issue-row{padding:10px 0;border-top:1px solid var(--line);font-size:12px}.store-list{display:grid;gap:8px}.store-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.store-row:last-child{border-bottom:0}.store-row b{display:block}.store-row span{font-size:10px;color:var(--muted)}.restore-list{display:grid;gap:8px}.restore-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px}.restore-row b{font-size:12px}.restore-row span{font-size:10px;color:var(--muted);display:block}.scene-chip{font-size:9px;padding:2px 6px;border-radius:999px;background:#f1dfce;color:#6f4a33;margin-left:4px}

/* V14 order screenshot + adaptive choices */
.wide-field{grid-column:1/-1}.order-card{border:1px solid #e7d2bf;background:#fff8ef;border-radius:16px;padding:12px;margin-top:10px}.order-card b{display:block;font-size:13px}.order-card span{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}.order-result{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.order-result div{background:#f4e7d9;border-radius:12px;padding:8px}.order-result span{font-size:9px;color:var(--muted)}.order-result b{font-size:12px;margin-top:2px}.order-actions{display:flex;gap:7px;margin-top:10px}.order-actions button{flex:1;border:1px solid var(--line);background:#fffaf4;color:var(--coffee);border-radius:12px;padding:9px;font-weight:700;font-size:11px}.ocr-progress{height:5px;background:#ead8c8;border-radius:99px;overflow:hidden;margin-top:8px}.ocr-progress i{display:block;height:100%;background:#7b5137;width:var(--ocr,8%);transition:width .25s}.preset button.product-preset{border-color:#d8b99d;background:#fff8ef}.preset button.product-preset b{display:block;font-size:11px}.preset button.product-preset span{display:block;font-size:9px;color:var(--muted);margin-top:2px}.taste-next{display:flex;align-items:flex-start;gap:10px}.taste-next .advice-icon{flex:0 0 auto}.taste-next p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.source-chip{display:inline-flex;align-items:center;border:1px solid #e0c8b3;background:#fff8ef;border-radius:999px;padding:2px 6px;font-size:9px;color:#7b5a46;margin-left:4px}


/* V15 smart record */
.source-chip-btn{border:0;cursor:pointer;font:inherit} 
.source-save{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 10px;border-radius:12px;background:rgba(255,250,244,.86);font-size:11px;color:#725747}.source-save input{width:16px;height:16px}.source-chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 6px;background:#efe1d3;color:#76533d;font-size:9px;font-weight:700;vertical-align:middle}.order-card .source-save{margin-bottom:2px}

.ocr-line-picks{display:grid;gap:7px;margin:12px 0}.ocr-line-picks button{width:100%;text-align:left;border:1px solid #e2cdb9;background:#fffdf9;color:#3f2a20;border-radius:13px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.35}.ocr-line-picks button:active{transform:scale(.99)}

.label-select-box{position:absolute;display:none;z-index:12;border:2px solid #6f4a33;border-radius:10px;background:rgba(255,248,235,.12);box-shadow:0 0 0 9999px rgba(36,24,18,.18),0 0 0 2px rgba(255,255,255,.65) inset;pointer-events:none}.photo-box.has-photo.selecting img{touch-action:none}.ocr-line-picks{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.ocr-line-picks button{border:1px solid #dec6b2;background:#fffaf4;border-radius:12px;padding:8px 10px;color:#573b2b;font-size:12px;text-align:left}.crop-read-preview{width:100%;max-height:160px;object-fit:contain;background:#fff;border-radius:12px;margin-top:8px}
</style>
<link rel="stylesheet" href="ui_upgrade.css">
<link rel="stylesheet" href="coffee_room.css">
</head>
<body>
<div class="alert" id="alert"></div>
<header class="top">
  <div class="brand-row">
    <div class="logo" aria-label="鼠鼠今天喝了啥图标"><img src="icon.png" alt="鼠鼠今天喝了啥"></div>
    <div><div class="brand-name">鼠鼠今天喝了啥</div><div class="brand-sub" id="brandSub">Beanster Sips</div></div>
    <div class="top-right"><button class="circle-btn" onclick="openSmartAdd('camera')" aria-label="拍照识别"><svg class="icon" viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H6a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3Z"/><circle cx="12" cy="12" r="3.2"/></svg></button></div>
  </div>
</header>
<main>
  <section id="today" class="page active"><div id="todayContent"></div></section>
  <section id="records" class="page">
    <div class="searchbar"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" class="search" placeholder="搜索咖啡、品牌、门店或备注"></div>
    <div class="filters"><button class="filter active" data-range="all">全部</button><button class="filter" data-range="today">今天</button><button class="filter" data-range="7">近 7 天</button><button class="filter" data-range="30">近 30 天</button><input id="filterDate" class="date-filter" type="date"><button class="filter" type="button" onclick="toggleAdvancedFilters()">筛选</button></div>
    <div id="advancedFilters" class="advanced-filters">
      <select id="advType" onchange="renderRecords()"><option value="">全部类型</option></select>
      <input id="advBrand" placeholder="品牌" oninput="renderRecords()">
      <select id="advTemp" onchange="renderRecords()"><option value="">冷 / 热</option><option value="冰">冰</option><option value="热">热</option></select>
      <select id="advPhoto" onchange="renderRecords()"><option value="">照片</option><option value="yes">有照片</option><option value="no">无照片</option></select>
      <select id="advScene" onchange="renderRecords()"><option value="">场景</option><option>想喝</option><option>提神</option><option>工作</option><option>学习</option><option>早餐</option><option>下午茶</option><option>社交</option></select>
      <input id="advMinPrice" type="number" inputmode="decimal" placeholder="最低价格" oninput="renderRecords()">
      <input id="advMaxPrice" type="number" inputmode="decimal" placeholder="最高价格" oninput="renderRecords()">
      <button type="button" class="ghost" onclick="resetAdvancedFilters()">清空筛选</button>
    </div>
    <div class="card" id="recordsList"></div>
  </section>
  <section id="analysis" class="page"><div id="analysisContent"></div></section>
  <section id="photos" class="page"><div id="photoContent"></div></section>
  <section id="settings" class="page"><div id="settingsContent"></div></section>
</main>
<input id="orderFile" type="file" accept="image/*" style="display:none" onchange="orderScreenshotChanged(this.files[0])">
<button class="fab" onclick="openAdd()" aria-label="记录咖啡"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<section class="page" id="collection"><div id="collectionContent"></div></section>
<nav class="nav">
  <button class="active" data-page="today"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>今日</button>
  <button data-page="records"><svg class="icon" viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>记录</button>
  <button data-page="collection"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v17H4zM4 12h16M9 4v17M15 4v17"/></svg>收藏室</button>
  <button data-page="analysis"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg>月报</button>
  <button data-page="settings"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.5 1a7 7 0 0 0-1.7-1L14.4 3h-4.8l-.4 3.1a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L5.1 11a7 7 0 0 0 0 2L3 14.5l2 3.4 2.5-1a7 7 0 0 0 1.7 1l.4 3.1h4.8l.4-3.1a7 7 0 0 0 1.7-1l2.5 1 2-3.4-2.1-1.5c.1-.3.1-.7.1-1Z"/></svg>设置</button>
</nav>

<div class="modal" id="addModal"><div class="sheet">
  <div class="handle"></div>
  <div class="row between"><div><h2 id="modalTitle">记录一杯咖啡</h2><div id="modalSub" class="muted" style="margin-top:3px">拍照、相册或快速添加</div></div><button class="ghost" onclick="closeAdd()">关闭</button></div>
  <div style="height:12px"></div>
  <div class="photo-box" id="photoBox"><div class="photo-placeholder"><svg class="icon" viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H6a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3Z"/><circle cx="12" cy="12" r="3.2"/></svg><b>拍咖啡、杯贴或选订单截图</b><div class="tiny" style="margin-top:4px">拍咖啡、杯贴或订单都可以</div></div></div>
  <div class="photo-actions">
    <label class="photo-action" onclick="prepareNativePhoto()"><svg class="icon" viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H6a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3Z"/><circle cx="12" cy="12" r="3.2"/></svg> 智能拍照<input id="fCamera" type="file" accept="image/*" capture="environment"></label>
    <label class="photo-action" onclick="prepareNativePhoto()"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 15-4-4-7 7"/></svg> 智能相册<input id="fGallery" type="file" accept="image/*"></label>
  </div>
  <div id="recognition" class="recognition"></div>
  <div class="section-title" style="margin-top:16px">常喝 / 快速添加 <span>点一下自动填写</span></div>
  <div class="preset" id="presets"></div>
  <button class="template-save-btn" type="button" onclick="saveCurrentTemplate()">＋ 保存到我的咖啡</button>
  <div class="formgrid">
    <div class="field wide-field"><label>饮品名称</label><input id="fProductName" placeholder="例如 生椰拿铁 / 橙C美式"></div>
    <div class="field"><label>咖啡类型</label><select id="fType"></select></div>
    <div class="field"><label>冷热</label><select id="fTemp"><option value="热">热</option><option value="冰">冰</option></select></div>
    <div class="field"><label>容量（ml）</label><input id="fSize" type="number" inputmode="decimal" value="350" oninput="recalcEstimate()"></div><div class="field"><label>Espresso shot 数</label><input id="fShots" type="number" min="0" max="8" step="1" value="2" oninput="recalcEstimate()"></div>
    <div class="field"><label>价格</label><input id="fPrice" type="number" inputmode="decimal" step="0.01" value="0"></div>
    <div class="field"><label>咖啡因（mg）</label><input id="fCaf" type="number" inputmode="decimal" value="164"><div class="tiny" id="cafHint" style="margin-top:5px;line-height:1.45">估算区间会根据品牌、容量和 shot 数更新</div></div>
    <div class="field"><label>热量（kcal）</label><input id="fCal" type="number" inputmode="decimal" value="10"></div>
    <div class="field"><label>品牌</label><select id="fBrand"><option value="">未选择</option><option>瑞幸咖啡</option><option>星巴克</option><option>Manner</option><option>库迪咖啡 COTTI</option><option>幸运咖</option><option>M Stand</option><option>Seesaw</option><option>% Arabica</option><option>Peet's Coffee</option><option>Tims 天好咖啡</option><option>COSTA</option><option>太平洋咖啡</option><option>McCafé 麦咖啡</option><option>KCOFFEE</option><option>挪瓦咖啡 NOWWA</option><option>Grid Coffee</option><option>Blue Bottle</option><option>其他 / 独立咖啡店</option></select></div>
    <div class="field"><label>门店</label><input id="fStore" placeholder="例如 国金店"></div>
    <div class="field"><label>日期</label><input id="fDate" type="date"></div>
    <div class="field"><label>时间</label><input id="fTime" type="time"></div>
    <div class="field"><label>这杯是为了</label><select id="fScene"><option value="">不记录</option><option>想喝</option><option>提神</option><option>工作</option><option>学习</option><option>早餐</option><option>下午茶</option><option>社交</option></select></div>
  </div>
  <div id="whatIf" class="what-if"></div>
  <div id="proFields" class="pro-fields">
    <div class="section-title" style="margin-top:12px">咖啡细节</div>
    <div class="formgrid">
      <div class="field"><label>豆子 / 产地</label><input id="fBeanOrigin" placeholder="例如 埃塞俄比亚 耶加雪菲"></div>
      <div class="field"><label>处理法</label><input id="fProcess" placeholder="例如 水洗 / 日晒"></div>
      <div class="field"><label>烘焙度</label><select id="fRoast"><option value="">未记录</option><option>浅烘</option><option>中烘</option><option>深烘</option></select></div>
      <div class="field"><label>粉水比</label><input id="fBrewRatio" placeholder="例如 1:15"></div>
    </div>
  </div>
  <div class="field"><label>口味评分</label><div class="rating" id="rating"></div></div>
  <div class="field"><label>备注</label><textarea id="fNote" placeholder="风味、心情、是否加糖……"></textarea></div>
  <div class="estimate-note"></div>
  <div style="height:12px"></div><button class="primary" onclick="saveRecord()"><svg class="icon" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span id="saveBtnText">保存这杯咖啡</span></button>
</div></div>

<div class="photo-viewer" id="photoViewer"><div class="viewer-toolbar"><button onclick="closePhotoViewer()" aria-label="关闭">×</button><button onclick="zoomPhoto(-.35)" aria-label="缩小">−</button><button onclick="zoomPhoto(.35)" aria-label="放大">＋</button><button class="save-photo" onclick="saveViewerPhoto()">保存原图</button></div><div class="viewer-stage"><img id="viewerImg" ondblclick="zoomPhoto(viewerScale>1.2?1-viewerScale:1)"></div><div class="caption" id="viewerCaption"></div></div>

<script src="app_v5.js"></script>
<script src="ui_upgrade.js"></script>
<script src="ocr_reader.js"></script>
<script src="art/upgrade-v1/manifest.js"></script>
<script src="motion.js"></script>
<script src="data_integrity.js"></script>
<script src="navigation.js"></script>
<script src="companion.js"></script>
<script src="local_vision.js"></script>
<script src="dashboard.js"></script>
<script src="recognition_flow.js"></script>
<script src="coffee_room.js"></script>
<script src="coffee_pages.js"></script>
</body>
</html>
