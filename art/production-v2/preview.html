<main><h1>仓鼠咖啡角 · 独立素材验收</h1><p>原角色、真实透明 PNG、统一基线与坐标。此页使用独立演示记录，不修改 App 数据。</p><div class="layout"><section class="card"><canvas id="scene" width="768" height="1024" aria-label="咖啡角，点击播放待机"></canvas><div class="controls"><button id="add">＋ 记录一杯</button><button id="night">日 / 夜</button><button id="collect">演示次日收杯</button><button id="skip">跳过</button></div><div class="controls"><button data-count="0">空桌</button><button data-count="1">1 杯</button><button data-count="4">4 杯</button><button data-count="7">7 杯</button></div><div id="stats" class="stats"></div></section><section class="card"><h2>杯子与动作锚点</h2><div class="controls"><select id="animation"><option value="cleanup">无杯收杯 12 帧</option><option value="idle">桌前待机 16 帧</option><option value="quickTransfer">快速收杯</option><option value="box">收藏盒状态</option></select><button id="play">播放一次</button><button id="anchors">显示 / 隐藏锚点</button></div><canvas id="inspect" width="768" height="640"></canvas><pre id="details"></pre><h2>收藏室 · 每次饮用独立一杯</h2><canvas id="shelf" width="1024" height="684"></canvas><p id="recordInfo">点击桌面或货架上的杯子查看演示记录。</p><button id="delete">删除选中记录</button></section></div><details><summary>全部独立 PNG 与透明边缘检查</summary><button id="dark">浅色 / 深色底</button><div id="gallery" class="gallery"></div></details><p><a href="asset_manifest.json">asset_manifest.json</a> · <a href="README.md">接入说明</a></p></main><script src="asset_manifest.js"></script><script src="preview.js"></script></html>
