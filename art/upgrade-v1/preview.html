<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beanster Sips · 升级素材预览</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#412b20;background:#f7f0e7;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{max-width:1440px;margin:auto;padding:48px 28px 20px}.eyebrow{letter-spacing:.16em;font-size:12px;color:#9a7051}h1{font-size:clamp(28px,4vw,48px);margin:12px 0}p{line-height:1.8;color:#84674f}nav{position:sticky;top:0;z-index:3;background:#f7f0e7f5;border-block:1px solid #e3d7c6;backdrop-filter:blur(12px)}.tools{display:flex;flex-wrap:wrap;gap:9px;max-width:1440px;margin:auto;padding:15px 28px}button,input,select{font:inherit;border:1px solid #d9c6b2;background:#fffaf3;border-radius:10px;padding:9px 13px;color:#573721}button{cursor:pointer}button.active{background:#68432f;color:white;border-color:#68432f}input{min-width:170px;flex:1}main{max-width:1440px;padding:24px 28px 60px;margin:auto}.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:28px}.hero article{background:#fffaf3;border:1px solid #e7d7c6;border-radius:24px;text-align:center;padding:18px}.hero img{width:min(100%,190px);display:block;margin:auto}.hero h3{margin:8px 0;font-size:17px}.hero p{font-size:12px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}.card{border:1px solid #e2d2c0;border-radius:16px;overflow:hidden;background:#fffaf3;min-width:0}.stage{height:174px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f5f0e8 0% 25%,#e7e0d5 0% 50%) 50%/20px 20px}.stage img{width:150px;height:150px;object-fit:contain}.dark .stage{background:#272529}.cream .stage{background:#fff8ed}.blue .stage{background:#51718b}.meta{padding:12px}.meta strong{font-size:15px;display:block}.meta code{font-size:10px;color:#947359;overflow-wrap:anywhere}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.links a{font-size:11px;color:#805139;text-decoration:none;border-bottom:1px solid #d4bca6}.badge{font-size:10px;color:#287048;margin:5px 0 0;display:block}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}.section-head h2{font-size:22px;margin:0}.section-head span{color:#91715b;font-size:13px}footer{margin-top:35px;color:#9b7e68;font-size:12px;line-height:1.8}a{color:#6f482d}@media(max-width:650px){header{padding:28px 18px 14px}.tools{padding:12px 18px}main{padding:20px 18px}.hero{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:145px}.stage img{width:128px;height:128px}}
</style>
<header><div class="eyebrow">BEANSTER SIPS / ART LIBRARY 01</div><h1>让鼠鼠，动起来。</h1><p>独立透明素材 · 十个逐帧角色 · 四种逐帧表情 · 透明贴纸<br>切换背景检查透明边缘，点击格式下载对应资源。</p></header>
<nav><div class="tools"><input id="search" placeholder="搜索名称 / 文件 ID" aria-label="搜索素材"><select id="category" aria-label="素材分类"><option value="all">全部分类</option></select><select id="format" aria-label="预览格式"><option value="webp">动态 WebP</option><option value="gif">动态 GIF</option><option value="png">静态 PNG</option></select><button data-theme="checker" class="active">棋盘格</button><button data-theme="cream">浅色</button><button data-theme="dark">深色</button><button data-theme="blue">蓝色</button></div></nav>
<main><section class="hero" id="hero"></section><div class="section-head"><h2>资源一览</h2><span id="count"></span></div><section class="grid" id="grid"></section><footer>所有下载文件自带透明通道；页面棋盘格仅用于检查透明度，不在素材里。<br>GIF 使用二值透明；PNG / 无损 WebP 支持柔和 Alpha 边缘。角色、状态贴纸、空状态及提示标签的动效是轻微浮动，四种头像采用生成的连续表情帧。<br><a href="manifest.json">资源清单</a> · <a href="qa-report.json">校验报告</a> · <a href="README.md">集成说明</a></footer></main>
<script src="manifest.js"></script>
<script>
const all=window.BEANSTER_ART.assets;
const names={characters:'角色',portraits:'表情头像',stamps:'日历印章',achievements:'成就徽章',stickers:'状态贴纸',locked:'未解锁徽章',drinks:'饮品',cups:'杯型',icons:'界面图标','empty-states':'空状态',decorations:'装饰元素',labels:'提示标签'};
const category=document.querySelector('#category'),format=document.querySelector('#format'),search=document.querySelector('#search');
Object.entries(names).forEach(([value,name])=>{const o=document.createElement('option');o.value=value;o.textContent=name;category.append(o)});
function src(a){return format.value==='png'?a.png['2x']:(a.animation?.[format.value]||a.png['2x'])}
function render(){let items=all.filter(a=>(category.value==='all'||a.category===category.value)&&(`${a.id} ${a.label}`).toLowerCase().includes(search.value.toLowerCase()));document.querySelector('#count').textContent=`${items.length} 项 / ${all.filter(a=>a.animation).length} 个动态素材`;
document.querySelector('#grid').innerHTML=items.map(a=>`<article class="card"><div class="stage"><img src="${src(a)}" alt="${a.label}" loading="lazy"></div><div class="meta"><strong>${a.label}</strong><code>${a.id}</code>${a.animation?`<span class="badge">${a.animation.type.startsWith('generated-')?'逐帧表情':'轻动效'} · ${a.animation.frameCount} 帧</span>`:''}<div class="links">${[1,2,3].map(n=>`<a download href="${a.png[n+'x']}">PNG ${n}×</a>`).join('')}${a.animation?`<a download href="${a.animation.gif}">GIF</a><a download href="${a.animation.webp}">WebP</a><a download href="${a.animation.spritesheet}">Sprite</a>`:''}</div></div></article>`).join('');
document.querySelector('#hero').innerHTML=all.filter(a=>a.category==='portraits').map(a=>`<article><img src="${src(a)}" alt="${a.label}"><h3>${a.label}</h3><p>6 帧循环 · 透明背景</p></article>`).join('');}
search.addEventListener('input',render);category.addEventListener('change',render);format.addEventListener('change',render);document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b))});
if(matchMedia('(prefers-reduced-motion: reduce)').matches)format.value='png';
render();
</script>
</html>
